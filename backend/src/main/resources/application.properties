spring.application.name=ET-Backend
spring.datasource.url = jdbc:postgresql://${DATABASE_URL}:5432/neondb
spring.datasource.username = ${DB_USER}
spring.datasource.password =${DB_PASS}
spring.datasource.driver-class-name = org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect

#spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true

server.port=8000
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# WAQI
waqi.base-url=https://api.waqi.info
waqi.token=${WAQI_TOKEN}
waqi.city=Delhi

# OPEN METEO
openmeteo.base-url=https://api.open-meteo.com

# OVERPASS
overpass.base-url=https://overpass-api.de/api/interpreter

scheduler.readings.fixed-rate=3600000
scheduler.weather.fixed-rate=3600000
scheduler.geo.fixed-rate=86400000
scheduler.geo.enabled=false

polling.station-ids=2553,2554,2556,3715